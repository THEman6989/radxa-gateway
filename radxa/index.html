<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radxa · PC-Steuerung</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f0f0f;color:#f3f4f6;font:15px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:100%;max-width:740px;background:#1a1a1a;border:1px solid #2d2d2d;border-radius:16px;padding:32px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:24px;color:#2dd4bf;margin:0}small,.muted{color:#9ca3af}.gateway{font-size:12px}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:28px 0}.tab{background:#151515;color:#9ca3af;border:1px solid #343434;border-radius:10px;padding:15px 6px;cursor:pointer;font:inherit}.tab[aria-selected=true]{border-color:#2dd4bf;background:#15332e;color:#f3f4f6}.tab strong{display:block;font-size:14px}.tab span{display:block;font-size:12px;margin-top:7px}.dot{display:inline-block!important;width:8px;height:8px;border-radius:100%;background:#6b7280;margin:0 6px 0 0!important}.online .dot{background:#22c55e}.offline .dot{background:#f87171}h2{margin:0 0 8px;font-size:24px}.detail{display:flex;align-items:center;justify-content:space-between;gap:12px}.badge{font-size:12px;padding:7px 10px;background:#272727;border-radius:20px;white-space:nowrap}.note{line-height:1.6;min-height:48px;margin:14px 0 22px;font-size:13px}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.btn{border:0;border-radius:9px;padding:15px 12px;color:#fff;font:600 14px system-ui;cursor:pointer}.wake{background:#15803d}.sleep{background:#a16207}.reboot{background:#1d4ed8}.shutdown{background:#b91c1c}.always{background:#6d28d9;width:100%;margin-top:16px}.always.active{background:#be185d}.btn:hover{filter:brightness(1.2)}.btn:disabled{opacity:.4;cursor:not-allowed}.always-status{font-size:12px;color:#c4b5fd;min-height:20px;margin-top:10px;line-height:1.5}.msg{font-size:13px;line-height:1.5;min-height:42px;margin-top:18px;overflow-wrap:anywhere}.msg.ok{color:#86efac}.msg.error{color:#fca5a5}footer{border-top:1px solid #2d2d2d;padding-top:16px;font-size:11px;color:#9ca3af;line-height:1.6}button:focus-visible{outline:3px solid #5eead4;outline-offset:3px}@media(max-width:480px){body{padding:12px}.card{padding:20px}header{align-items:flex-start;flex-direction:column}h1{font-size:22px}.tab strong{font-size:12px}.detail{gap:8px}h2{font-size:22px}}
</style></head><body><main class="card"><header><h1>Radxa ROCK 2A</h1><span class="gateway">PC-Steuerung · Tailscale</span></header>
<nav role="tablist" aria-label="PC auswählen">
<button class="tab" role="tab" id="tab-main" aria-controls="panel" aria-selected="true" data-device="main"><strong>Haupt-PC</strong><span class="state"><i class="dot"></i>Prüfe …</span></button>
<button class="tab" role="tab" id="tab-mi50" aria-controls="panel" aria-selected="false" data-device="mi50"><strong>MI50-PC</strong><span class="state"><i class="dot"></i>Prüfe …</span></button>
<button class="tab" role="tab" id="tab-unraid" aria-controls="panel" aria-selected="false" data-device="unraid"><strong>Unraid-PC</strong><span class="state"><i class="dot"></i>Prüfe …</span></button>
</nav><section id="panel" role="tabpanel" aria-labelledby="tab-main"><div class="detail"><h2 id="name">Haupt-PC</h2><span id="status" class="badge">Prüfe …</span></div><p id="note" class="muted note">Status wird geladen.</p>
<div class="actions"><button class="btn wake" data-action="wake">Aufwecken</button><button class="btn sleep" data-action="sleep">Schlafen</button><button class="btn reboot" data-action="reboot">Neustarten</button><button class="btn shutdown" data-action="shutdown">Herunterfahren</button></div>
<button class="btn always" id="alwaysonBtn">↻ Always On</button><div class="always-status" id="alwaysStatus"></div>
<button class="btn wake" id="wakewinBtn" data-action="wakewin" hidden style="width:100%;margin-top:12px">🖥️ Windows wecken</button>
<aside id="mi50Health" hidden aria-live="polite" style="margin-top:16px;padding:14px;border:1px solid #525252;border-radius:10px;line-height:1.6;font-size:13px"><strong id="healthText"></strong><pre id="healthEvidence" style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px"></pre><p id="hardoffStatus"></p><a href="https://rock-2a.tail852b38.ts.net:4444/" target="_blank" rel="noopener" style="color:#5eead4">KVM öffnen ↗</a></aside>
<button class="btn shutdown" id="hardoffBtn" hidden style="width:100%;margin-top:14px;border:1px solid #f87171">⚠ Hard Off · 8 Sekunden Power-Taste</button>
<div class="msg" id="msg" role="status" aria-live="polite"></div></section>
<footer><span id="checked">Verbindung wird geprüft …</span><br>Online = im Netzwerk erreichbar. „Nicht erreichbar“ kann auch Standby oder ein Netzwerkproblem bedeuten. Always On läuft auf dem Gateway, auch bei geschlossenem Tab.</footer></main>
<script>
let selected='main', devices={}, busy=false, fresh=false;
const names={main:'Haupt-PC',mi50:'MI50-PC',unraid:'Unraid-PC'};
const messages={};
const $=id=>document.getElementById(id);
function render(){
 document.querySelectorAll('[data-device]').forEach(tab=>{const d=devices[tab.dataset.device];tab.setAttribute('aria-selected',String(tab.dataset.device===selected));tab.classList.remove('online','offline');if(fresh&&d)tab.classList.add(d.online?'online':'offline');const warning=fresh&&d?.health&&['danger','warning'].includes(d.health.level);tab.style.borderColor=warning?(d.health.level==='danger'?'#f87171':'#fbbf24'):'';tab.querySelector('.state').innerHTML='<i class="dot"></i>'+(warning?'⚠ Problem':fresh&&d?(d.online?'Online':'Nicht erreichbar'):'Status unbekannt');});
 const d=devices[selected], a=d?.alwayson;
 $('name').textContent=names[selected];$('panel').setAttribute('aria-labelledby','tab-'+selected);
 $('status').textContent=fresh&&d?(d.online?'● Online':'● Nicht erreichbar'):'Status unbekannt';
 $('note').textContent=(d?.note||'Status wird geladen.')+(d?.watchdog_paused?' Recovery-Watchdog ist pausiert.':'');
 $('alwaysonBtn').classList.toggle('active',Boolean(a?.active));$('alwaysonBtn').textContent=a?.active?'■ Always On beenden':'↻ Always On';
 $('alwaysStatus').textContent=a?.active?((a.inhibitor_active?'Schlafschutz aktiv':'Schlafschutz verbindet …')+' · noch '+Math.ceil(a.remaining_min/60)+' h'):'Schlafschutz und regelmäßiges Wake-on-LAN für dieses Gerät.';
 document.querySelectorAll('.btn').forEach(b=>{b.disabled=busy||!fresh||!d||(Boolean(a?.active)&&['sleep','shutdown','reboot'].includes(b.dataset.action));});
 const health=d?.health, hard=health?.hardoff;
 $('wakewinBtn').hidden=selected!=='unraid';
 $('mi50Health').hidden=selected!=='mi50';$('hardoffBtn').hidden=selected!=='mi50';
 $('healthText').textContent=fresh?(health?.message||'Wächterstatus unbekannt.'):'Wächterstatus unbekannt — Gateway-Abfrage fehlgeschlagen.';
 $('healthEvidence').textContent=fresh?(health?.evidence||''):'';
 $('mi50Health').style.borderColor=health?.level==='danger'?'#f87171':health?.level==='warning'?'#fbbf24':'#525252';
 $('hardoffStatus').textContent=hard?.message||'Hard Off funktioniert über den unabhängigen Controller, auch bei eingefrorenem Ubuntu. Datenverlust möglich.';
 if(selected==='mi50'&&hard?.status==='pending'){document.querySelectorAll('.btn').forEach(b=>b.disabled=true);}
 $('hardoffBtn').disabled=busy||!fresh||['pending','unknown'].includes(hard?.status);
 const m=messages[selected];$('msg').textContent=m?.text||'';$('msg').className='msg '+(m?.ok?'ok':'error');
}
async function refresh(){try{const r=await fetch('/api/devices',{cache:'no-store',signal:AbortSignal.timeout(10000)});if(!r.ok)throw Error(r.status);const state=await r.json();devices=Object.fromEntries(state.devices.map(d=>[d.id,d]));fresh=true;$('checked').textContent='Zuletzt geprüft: '+new Date(state.checked_at*1000).toLocaleTimeString('de-DE');}catch(e){fresh=false;$('checked').textContent='Statusabfrage fehlgeschlagen — Verbindung prüfen.';}render();}
function doubleConfirm(q){return confirm(q)&&confirm('WIRKLICH? '+q);}
async function action(action,body){
 const target=selected,name=names[target];
 if(action!=='wake'&&!['wake','wakewin'].includes(action)&&!doubleConfirm(name+': '+({'hardoff':'HART AUSSCHALTEN (Power-Taste 8 Sekunden halten, Datenverlust möglich; Always On wird beendet)', 'sleep':'in Standby versetzen','reboot':'neu starten','shutdown':'herunterfahren','alwayson/start':'Always On starten','alwayson/stop':'Always On beenden'}[action])+'?'+(target==='mi50'&&['sleep','shutdown','reboot'].includes(action)?' Der Recovery-Watchdog wird pausiert.':'')))return;
 busy=true;messages[target]={text:'Befehl an '+name+' wird gesendet …',ok:true};render();
 try{const r=await fetch('/api/devices/'+target+'/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{}),signal:AbortSignal.timeout(30000)});const data=await r.json();messages[target]={text:data.message||'Keine Rückmeldung.',ok:data.status==='ok'};}catch(e){messages[target]={text:'Keine sichere Rückmeldung. Status prüfen; Aktion nicht blind wiederholen.',ok:false};}
 await refresh();busy=false;render();
}
document.querySelectorAll('[data-device]').forEach(tab=>{tab.onclick=()=>{selected=tab.dataset.device;render();};});
document.querySelectorAll('[data-action]').forEach(btn=>{btn.onclick=()=>action(btn.dataset.action);});
$('hardoffBtn').onclick=()=>action('hardoff',{confirm_hardoff:true});
$('alwaysonBtn').onclick=()=>{if(devices[selected]?.alwayson?.active){action('alwayson/stop');return;}const input=prompt(names[selected]+': Wie viele Stunden? (0 = unbegrenzt)','24');if(input===null)return;const hours=Number(input);if(input.trim()===''||!Number.isInteger(hours)||hours<0||hours>9999){alert('Bitte 0 bis 9999 ganze Stunden eingeben.');return;}action('alwayson/start',{hours});};
async function poll(){await refresh();setTimeout(poll,5000);}poll();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});
</script></body></html>
